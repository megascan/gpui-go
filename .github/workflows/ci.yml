name: ci

on:
  pull_request:
  push:
    branches: [feat/port]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev libwayland-client0 wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-xcb-dev libxcb-xkb-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-render0-dev \
            libvulkan1 libvulkan-dev mesa-vulkan-drivers vulkan-tools \
            libpipewire-0.3-dev \
            xvfb dbus dbus-x11

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        if: runner.os != 'Linux'
        run: go test ./...

      - name: example builds (macOS)
        if: runner.os == 'macOS'
        run: go build -o /dev/null ./examples/...

      - name: go test (Linux, Xvfb, private bus)
        if: runner.os == 'Linux'
        env:
          GPUI_TEST_DISPLAY: '1'
        run: xvfb-run -a dbus-run-session -- go test ./...

      - name: Cross vet and test build
        if: runner.os == 'Linux'
        run: |
          for t in darwin/arm64 windows/amd64 js/wasm; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go vet ./...
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go test -c -o /dev/null ./...
          done

      - name: wasm tests
        if: runner.os == 'Linux'
        run: |
          if [ -d platform/web ]; then
            pkgs=./platform/web/...
            if [ -d render/wgpu/internal/gpu/webgl2 ]; then pkgs="$pkgs ./render/wgpu/internal/gpu/webgl2/..."; fi
            GOOS=js GOARCH=wasm go test -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" $pkgs
          fi

      - name: web example build
        if: runner.os == 'Linux'
        run: |
          if [ -d examples/web_hello_web ]; then
            GOOS=js GOARCH=wasm go build -o /dev/null ./examples/web_hello_web
          fi

      - name: go generate is reproducible
        if: runner.os == 'Linux'
        run: |
          go generate ./...
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

      - name: go test -race (non-display packages)
        if: runner.os == 'Linux'
        run: go test -race $(go list ./... | grep -vE '/(examples|render/wgpu|internal/cmd/wlspike)(/|$)|/platform/linux/(wayland|x11)(/|$)')

      - name: paritycheck
        if: runner.os == 'Linux'
        run: go run ./internal/cmd/paritycheck -lint
